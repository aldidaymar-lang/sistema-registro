<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Autenticación</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #ffffff; padding: 40px 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 360px; text-align: center; }
        .card h2 { color: #333333; margin-bottom: 8px; font-size: 24px; font-weight: 600; }
        .card p.subtitle { color: #777777; font-size: 14px; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #555555; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #cccccc; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.3s; }
        .input-group input:focus { border-color: #2a5298; }
        .btn-container { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        .btn-login { background-color: #2a5298; color: white; }
        .btn-login:hover { background-color: #1e3c72; }
        .btn-register { background-color: #e0e0e0; color: #333333; }
        .btn-register:hover { background-color: #d0d0d0; }
        #mensaje { margin-top: 20px; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: 600; display: none; }
        .exito { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block !important; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block !important; }
    </style>
</head>
<body>

<div class="card">
    <h2>Sistema de Registro</h2>
    <p class="subtitle">Ingrese sus credenciales de acceso</p>

    <div class="input-group">
        <label for="nombre">Usuario</label>
        <input type="text" id="nombre" placeholder="Ej. aldimar">
    </div>

    <div class="input-group">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" placeholder="••••••••">
    </div>

    <div class="btn-container">
        <button class="btn-register" onclick="enviarDatos('/registrar')">Registrar</button>
        <button class="btn-login" onclick="enviarDatos('/login')">Ingresar</button>
    </div>

    <div id="mensaje"></div>
</div>

<script>
async function enviarDatos(ruta) {
    const nombre = document.getElementById('nombre').value;
    const clave = document.getElementById('clave').value;
    const mensajeDiv = document.getElementById('mensaje');

    mensajeDiv.className = '';
    
    if (!nombre || !clave) {
        mensajeDiv.innerText = "Por favor completa ambos campos.";
        mensajeDiv.className = "error";
        return;
    }

    try {
        const respuesta = await fetch(ruta, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, clave })
        });

        const resultado = await respuesta.json();

        if (respuesta.ok) {
            mensajeDiv.innerText = resultado.mensaje;
            mensajeDiv.className = "exito";
        } else {
            mensajeDiv.innerText = resultado.error;
            mensajeDiv.className = "error";
        }
    } catch (err) {
        mensajeDiv.innerText = "Error de conexión con el servidor.";
        mensajeDiv.className = "error";
    }
}
</script>

</body>
</html>
