<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Registro</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        h2 { margin-bottom: 20px; color: #333; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        #mensaje { margin-top: 15px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

<div class="card">
    <h2>Inicio de Sesión</h2>
    <input type="text" id="nombre" placeholder="Nombre de usuario">
    <input type="password" id="clave" placeholder="Contraseña">
    <button onclick="enviarDatos('/registrar')">Registrar</button>
    <button onclick="enviarDatos('/login')">Ingresar</button>
    <p id="mensaje"></p>
</div>

<script>
async function enviarDatos(ruta) {
    const nombre = document.getElementById('nombre').value;
    const clave = document.getElementById('clave').value;
    const mensaje = document.getElementById('mensaje');

    if (!nombre || !clave) {
        mensaje.innerText = "Por favor completa ambos campos.";
        return;
    }

    const respuesta = await fetch(ruta, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, clave })
    });

    const resultado = await respuesta.json();
    mensaje.innerText = resultado.mensaje || resultado.error;
}
</script>

</body>
</html>
